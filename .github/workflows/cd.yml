name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: expense-tracker-release
          path: artifact

      - name: Debug Repository Secrets
        run: |
          if [ -z "${{ secrets.AZURE_VM_HOST }}" ]; then
            echo "❌ AZURE_VM_HOST is EMPTY"
            exit 1
          else
            echo "✅ AZURE_VM_HOST found"
          fi

          if [ -z "${{ secrets.AZURE_VM_USER }}" ]; then
            echo "❌ AZURE_VM_USER is EMPTY"
            exit 1
          else
            echo "✅ AZURE_VM_USER found"
          fi

          if [ -z "${{ secrets.AZURE_VM_SSH_KEY }}" ]; then
            echo "❌ AZURE_VM_SSH_KEY is EMPTY"
            exit 1
          else
            echo "✅ AZURE_VM_SSH_KEY found"
          fi

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Add Azure VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.AZURE_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to Azure VM
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} \
            "rm -rf ~/ExpenseTracker && mkdir -p ~/ExpenseTracker"
          scp -r artifact/* \
            ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }}:~/ExpenseTracker/

      - name: Deploy on Azure VM
        run: |
          ssh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} << 'EOF'
            cd ~/ExpenseTracker
            chmod +x deploy.sh
            sudo ./deploy.sh
          EOF