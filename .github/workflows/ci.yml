name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 9.0.2
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Begin SonarQube Analysis
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore ExpenseTracker.sln

      - name: Build
        run: dotnet build ExpenseTracker.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test ExpenseTracker.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube Analysis
        if: always()
        run: |
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publish API
        run: |
          dotnet publish ExpenseTracker.API/ExpenseTracker.API.csproj \
            --configuration Release \
            --no-restore \
            --output release/app

      - name: Assemble Deployment Artifact
        run: |
          cp scripts/deploy.sh scripts/expense-tracker.service release/

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults
          if-no-files-found: warn

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-release
          path: release